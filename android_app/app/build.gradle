plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eduvos.sharamigo'
    compileSdk 34

    defaultConfig {
        applicationId "com.eduvos.sharamigo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Emulator: 10.0.2.2 is your PC. Real phone: use your PC's Wi-Fi IP, for example
            // "http://192.168.1.100/sharamigo/backend/api/"
            buildConfigField "String", "BASE_URL", '"http://10.0.2.2/sharamigo/backend/api/"'
        }
        release {
            // Put your live HTTPS address here before building a release.
            buildConfigField "String", "BASE_URL", '"https://CHANGE-ME.example.com/backend/api/"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Retrofit 2 & OkHttp (Networking with PHP Backend)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Glide (Image Loading & Caching)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ZXing (Dynamic QR Code Generation & Scanning)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'
}
